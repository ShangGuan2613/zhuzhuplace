<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>
            {% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}
        </title>
        <meta
            name="description"
            content="{{ page.description | default: site.description }}"
        />
        <link rel="stylesheet" href="assets/css/style.css" />
        <script>
            (function () {
                var stored = null;
                try {
                    stored = localStorage.getItem("theme");
                } catch (e) {}
                var dark = window.matchMedia(
                    "(prefers-color-scheme: dark)",
                ).matches;
                document.documentElement.setAttribute(
                    "data-theme",
                    stored || (dark ? "dark" : "light"),
                );
            })();
        </script>
    </head>
    <body>
        <aside class="sidebar" id="sidebar">
            <a class="brand" href="./">
                <span class="brand-name">{{ site.title }}</span>
                <span class="brand-desc">{{ site.description }}</span>
            </a>
            <nav class="nav">
                {% assign notes = site.pages | sort: "order" %} {% for p in
                notes %}{% if p.order %}
                <a
                    class="nav-link{% if p.url == page.url %} is-active{% endif %}"
                    href="{{ p.url | remove_first: '/' }}"
                    >{{ p.title }}</a
                >
                {% endif %}{% endfor %}
            </nav>
        </aside>
        <div class="overlay" id="overlay"></div>

        <div class="main">
            <header class="topbar">
                <button class="icon-btn" id="menuToggle" aria-label="打开目录">
                    ☰
                </button>
                <span class="topbar-title"
                    >{{ page.title | default: site.title }}</span
                >
                <button class="icon-btn" id="themeToggle" aria-label="切换主题">
                    ◐
                </button>
            </header>

            <main class="content">{{ content }}</main>

            <footer class="footer">
                <span>{{ site.title }}</span>
                <span class="dot">·</span>
                <a href="./">首页</a>
            </footer>
        </div>

        <script src="assets/js/site.js"></script>
    </body>
</html>
